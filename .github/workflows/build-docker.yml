name: Build Docker image

on:
  workflow_call:
    inputs:
      push-image:
        description: 'Push the built image to ghcr.io once it has passed verification.'
        required: false
        type: boolean
        default: false
      run-verification:
        description: >
          Run the endpoint smoke IT suite - and, since it's the actual deliverable, a Gatling load-smoke run too -
          against the freshly built native image before it is pushed. build-code.yml already ran the same endpoint
          suite against a plain-JRE jar image; PerformanceSmokeIT itself skips there, since JVM performance figures
          don't reflect the native image actually shipped.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set-up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Log in to the Container registry
        if: inputs.push-image
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the Buildpacks builder image digest
        id: builder
        run: |
          image=$(./mvnw -q help:evaluate -Dexpression=buildpacks-builder.image -DforceStdout)
          echo "digest=${image##*@}" >> "$GITHUB_OUTPUT"
      - name: Restore the Buildpacks cache
        id: buildpacks-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/buildpacks-layers.tar.gz
          key: buildpacks-native-${{ steps.builder.outputs.digest }}
          restore-keys: buildpacks-native-
      - name: Load the Buildpacks cache
        if: steps.buildpacks-cache.outputs.cache-matched-key != ''
        run: |
          docker run --rm -v members-api.build-cache:/cache/build -v members-api.launch-cache:/cache/launch \
            -v /tmp:/backup busybox tar xzf /backup/buildpacks-layers.tar.gz -C /cache
      - name: Build native image
        run: ./mvnw -B spring-boot:build-image -Pnative
      - name: Determine image reference
        id: image
        run: >
          echo "reference=ghcr.io/lyra-oss/members-api:$(./mvnw -q help:evaluate
          -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Save the Buildpacks cache
        if: always()
        run: |
          docker run --rm -v members-api.build-cache:/cache/build -v members-api.launch-cache:/cache/launch \
            -v /tmp:/backup busybox tar czf /backup/buildpacks-layers.tar.gz -C /cache build launch
      - name: Upload the Buildpacks cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/buildpacks-layers.tar.gz
          key: buildpacks-native-${{ steps.builder.outputs.digest }}
      - name: Verify the native image
        if: inputs.run-verification
        run: ./mvnw -B -Dit.image=${{ steps.image.outputs.reference }} verify
      - name: Push the verified image
        id: push
        if: inputs.push-image
        run: |
          docker push ${{ steps.image.outputs.reference }}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.image.outputs.reference }} | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: inputs.push-image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/lyra-oss/members-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
