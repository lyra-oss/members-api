name: Debug Sonar issues

on:
  push:
    branches:
      - 'claude/upbeat-edison-7d35n1'
    paths:
      - '.github/workflows/_debug-sonar-issues.yml'

permissions:
  contents: read

jobs:
  print-issues:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Print new-code issues and hotspots
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for scope in "pullRequest=82" "branch=claude%2Fupbeat-edison-7d35n1"; do
            echo "=== scope: $scope ==="
            url="https://sonarcloud.io/api/issues/search?componentKeys=lyra-oss_members-api&${scope}&sinceLeakPeriod=true&ps=100"
            echo "--- issues ($url) ---"
            curl -sS -u "$SONAR_TOKEN:" "$url" | jq '.issues[] | {rule, severity, type, component, line, message, status}'
            hurl="https://sonarcloud.io/api/hotspots/search?projectKey=lyra-oss_members-api&${scope}&ps=100"
            echo "--- hotspots ($hurl) ---"
            curl -sS -u "$SONAR_TOKEN:" "$hurl" | jq '.hotspots[] | {ruleKey, vulnerabilityProbability, component, line, message, status}'
          done
