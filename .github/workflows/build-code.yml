name: Build source code

on:
  workflow_call:
    inputs:
      mutation-scope:
        description: >
          "changed" mutation-tests only the main-source classes touched since the push's previous commit (falling
          back to "full" when that can't be determined, e.g. a branch's first push); "full" always mutation-tests
          every class.
        required: false
        type: string
        default: 'full'

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Check Maven artifact
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set-up GraalVM
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-openapi-to-postmanv2-6.3.3
      - name: Resolve the Buildpacks builder image digest
        id: builder
        # pom.xml doesn't pin <image><builder>, so this is spring-boot-maven-plugin's own default
        # (org.springframework.boot.buildpack.platform.build.BuildRequest.DEFAULT_BUILDER_IMAGE_REF) - update this
        # alongside pom.xml if that default is ever pinned to something else there. Resolved from the registry
        # (no pull) so the cache key changes exactly when Paketo publishes a new builder, not on unrelated commits.
        run: |
          digest=$(docker buildx imagetools inspect paketobuildpacks/builder-noble-java-tiny:latest \
            | grep -m1 '^Digest:' | awk '{print $2}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the Buildpacks cache
        id: buildpacks-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/buildpacks-layers.tar.gz
          key: buildpacks-jvm-${{ steps.builder.outputs.digest }}
          restore-keys: buildpacks-jvm-
      - name: Load the Buildpacks cache
        if: steps.buildpacks-cache.outputs.cache-matched-key != ''
        run: |
          docker run --rm -v members-api.build-cache:/cache/build -v members-api.launch-cache:/cache/launch \
            -v /tmp:/backup busybox tar xzf /backup/buildpacks-layers.tar.gz -C /cache
      - name: Build the JVM deliverable
        run: ./mvnw -B clean spring-boot:build-image
      - name: Determine image reference
        id: image
        run: >
          echo "reference=ghcr.io/lyra-oss/members-api:$(./mvnw -q help:evaluate
          -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Save the Buildpacks cache
        if: always()
        run: |
          docker run --rm -v members-api.build-cache:/cache/build -v members-api.launch-cache:/cache/launch \
            -v /tmp:/backup busybox tar czf /backup/buildpacks-layers.tar.gz -C /cache build launch
      - name: Upload the Buildpacks cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/buildpacks-layers.tar.gz
          key: buildpacks-jvm-${{ steps.builder.outputs.digest }}
      - name: Verify against the JVM image
        run: ./mvnw -B -Dit.image=${{ steps.image.outputs.reference }} verify
      - name: Check the Postman collection is up to date
        run: ./scripts/generate-postman-collection.sh --check
      - name: Determine mutation testing scope
        id: mutation-scope
        if: inputs.mutation-scope == 'changed'
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "Previous commit unknown (e.g. this branch's first push); falling back to a full mutation run"
            echo "targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          targets=$(git diff --name-only --diff-filter=d "$before" "${{ github.sha }}" -- 'src/main/java/**/*.java' \
            | sed -E 's#^src/main/java/##; s#\.java$##; s#/#.#g' | paste -sd, -)
          echo "Classes changed since $before: ${targets:-<none>}"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      - name: Mutation Tests (changed classes)
        if: inputs.mutation-scope == 'changed' && steps.mutation-scope.outputs.targets != ''
        run: >
          ./mvnw -B org.pitest:pitest-maven:mutationCoverage -DmutationThreshold=90
          -DtargetClasses=${{ steps.mutation-scope.outputs.targets }}
      - name: Mutation Tests (everything)
        if: inputs.mutation-scope == 'full' || (inputs.mutation-scope == 'changed' && steps.mutation-scope.outputs.targets == '')
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage -DmutationThreshold=90
      - name: Run SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=lyra-oss_members-api
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.qualitygate.wait=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
