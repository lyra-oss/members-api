logging.level.root=info
spring.application.group=edu.lyra
spring.application.name=members-api
server.servlet.context-path=/v@parsedVersion.majorVersion@
spring.jackson.default-property-inclusion=non_empty
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
spring.data.web.pageable.default-page-size=20
# Every @ManyToOne/@OneToOne is LAZY, and the *Adapter maps entities to models after the repository's transaction
# has closed, so the session must stay open for the request. Set explicitly rather than inherited from the Spring
# Boot default, because the fetch plan depends on it. Pinned by OpenSessionInViewTest.
spring.jpa.open-in-view=true
#---
spring.config.activate.on-cloud-platform=kubernetes
logging.structured.format.console=ecs
management.endpoint.health.probes.enabled=true
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=validate
