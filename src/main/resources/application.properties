logging.level.root=info
spring.application.group=edu.lyra
spring.application.name=members-api
server.servlet.context-path=/v@parsedVersion.majorVersion@
spring.jackson.default-property-inclusion=non_empty
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true
spring.data.web.pageable.default-page-size=20
spring.jpa.open-in-view=true
# Spring Boot's AOT processing (spring-boot:process-aot) bakes @ConditionalOnProperty-gated bean *registrations*
# into the native image based on whatever the build environment sees - real deployments only set the real
# issuer-uri as an environment variable at container start, never at build time, so without a placeholder here
# the JwtDecoder bean definition itself would be permanently stripped from the native image, regardless of what's
# supplied later. The generated code still re-reads this property from the real Environment at startup (this
# value never reaches an actual bean, let alone a native-image-time HTTP call), so the real
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI override still takes effect as normal.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://placeholder.invalid/realms/members-api
# The OpenAPI description is generated at build time (see OpenApiExportTest) to feed the committed Postman
# collection, never served live: springdoc's own /v3/api-docs endpoint stays off in every environment.
springdoc.api-docs.enabled=false
#---
spring.config.activate.on-cloud-platform=kubernetes
logging.structured.format.console=ecs
management.endpoint.health.probes.enabled=true
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=validate
